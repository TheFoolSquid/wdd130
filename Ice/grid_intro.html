<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Document</title>
        <style>
            div {
                height: 200px;
                background-color: rgb(255, 0, 102);
                color: white;
            }

            body {
                display: grid;
                grid-template-columns: 1fr 2fr 1fr;
                gap: 20px;
            }
            div:nth-child(1){
                background-color: purple;
                grid-column: 1 / 4;
            }
            div:nth-child(2) {
                background-color: darkturquoise;
                grid-row: 2 / 4;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </body>
</html>
