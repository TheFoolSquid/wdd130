<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apostles Spotlights</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                text-align: center;
            }
            #background {
                background-image: url('images/christus.webp');
                background-size: cover;
                width: 1000px;
                border: 5px solid #000000;
                border-radius: 100px;
                padding: 50px;
            }
            img {
                border: 10px solid white;
                border-radius: 100%;
                width: 110px;
                height: 110px;
                object-fit: cover;
            }
            #presidency {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 25px;
            }
            h1, h2 {
                color: white;
            }
            #apostles {
                grid-template-columns: 1fr 1fr 1fr 1fr;
                display: grid;
                align-content: center;
                margin-left: 100px;
            }
            #presidency img:nth-child(2) {
                width: 150px;
                height: 150px;
            }
        </style>
    </head>
    <body>
        <div id="background">
            <h1>First Presidency</h1>
            <div>
                <div id="presidency">
                    <img src="images/eyring.webp">
                    <img src="images/oaks.webp">
                    <img src="images/christofferson.webp">
                </div>
                <h2>Quorum of the Twelve Apostles</h2>
                <div id="apostles">
                    <img src="images/anderson.webp">
                    <img src="images/bednar.webp">
                    <img src="images/cook.webp">
                    <img src="images/gilbert.webp">
                    <img src="images/gong.webp">
                    <img src="images/kearon.webp">
                    <img src="images/rasband.webp">
                    <img src="images/renlund.webp">
                    <img src="images/soares.webp">
                    <img src="images/stevenson.webp">
                    <img src="images/uchtdorf.webp">
                    <img src="images/causse.webp">
                </div>
            </div>
        </div>
    </body>
</html>
